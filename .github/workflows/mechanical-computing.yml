name: Mechanical Computing — checks

# Tests, type checks and a build for courses/mechanical-computing. (Deployment is in deploy.yml.)
on:
  push:
    branches: [main]
    paths: ['courses/mechanical-computing/**', '.github/workflows/mechanical-computing.yml']
  pull_request:
    paths: ['courses/mechanical-computing/**', '.github/workflows/mechanical-computing.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: courses/mechanical-computing

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/mechanical-computing/package-lock.json
      - run: npm ci
      - name: Machine, engine, model and content tests
        run: npm test
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Build
        run: npm run build
