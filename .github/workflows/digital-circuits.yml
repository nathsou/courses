name: Digital Circuits — checks

# Tests, type checks and a build for courses/digital-circuits. (Deployment is in deploy.yml.)
on:
  push:
    branches: [main]
    paths: ['courses/digital-circuits/**', '.github/workflows/digital-circuits.yml']
  pull_request:
    paths: ['courses/digital-circuits/**', '.github/workflows/digital-circuits.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: courses/digital-circuits

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/digital-circuits/package-lock.json
      - run: npm ci
      # synth, the Weft compiler and iCE40 toolchain, built to WebAssembly from the commit pinned in synth.json.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: courses/digital-circuits/static/synth
          key: synth-wasm-${{ hashFiles('courses/digital-circuits/synth.json', 'courses/digital-circuits/scripts/synth.mjs') }}
      - name: Build synth to WebAssembly
        run: npm run synth -- --check || npm run synth
      - name: Simulator, toolchain and content tests
        run: npm test
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Build
        run: npm run build
