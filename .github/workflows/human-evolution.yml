name: Human Evolution — checks
on:
  push:
    branches: [main]
    paths: ['courses/human-evolution/**', 'packages/course-navigation/**', '.github/workflows/human-evolution.yml']
  pull_request:
    paths: ['courses/human-evolution/**', 'packages/course-navigation/**', '.github/workflows/human-evolution.yml']
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    working-directory: courses/human-evolution
jobs:
  course:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/human-evolution/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Build under the deployment prefix
        run: BASE_PATH=/courses/human-evolution npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify learning and navigation workflows
        run: BASE_PATH=/courses/human-evolution npm run test:browser
