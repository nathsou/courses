name: Music Theory — checks

# Tests, type checks and a build for courses/music-theory. (Deployment is in deploy.yml.)
on:
  push:
    branches: [main]
    paths: ['courses/music-theory/**', '.github/workflows/music-theory.yml']
  pull_request:
    paths: ['courses/music-theory/**', '.github/workflows/music-theory.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: courses/music-theory

jobs:
  site:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --experimental-strip-types
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: courses/music-theory/package-lock.json
      - run: npm ci
      - name: Library, engraver, exercise and content tests
        run: npm test
      - name: Type-check (svelte-check)
        run: npm run check
      - name: Build
        run: npm run build
