# Glossary: id → { term, definition (Markdown), chapter (slug) }
chord:
  term: chord
  definition: Three or more different notes sounded together. Chapter 10 builds the common kinds from the scale.
  chapter: four-chords
key:
  term: key
  definition: The home a piece of music settles on, and the scale of notes it is mostly made from; C major, for example. Chapter 7 covers all of them.
  chapter: four-chords
midi:
  term: MIDI
  definition: 'Musical Instrument Digital Interface: the standard (1983) by which a digital keyboard tells a computer which keys go down and up, and how hard they were struck. It carries keys, not sound.'
  chapter: four-chords
roman-numeral:
  term: Roman numeral
  definition: 'A chord named by the scale degree of its root: in C major, I is C, V is G, vi is A minor and IV is F. Upper case for major chords, lower case for minor ones.'
  chapter: four-chords
latency:
  term: latency
  definition: The delay between an action and its result; here, between a key going down and its message reaching the page, and between the page making a sound and you hearing it.
  chapter: four-chords
