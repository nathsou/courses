  people: Hans von Mangoldt
  chapter: explicit-formula
  text: '$\psi_0(x) = x - \sum_\rho x^\rho/\rho - \log 2\pi - \frac12\log(1 - x^{-2})$.'
- year: 1896
  title: The prime number theorem
  people: Jacques Hadamard, Charles de la Vallée Poussin
  chapter: pnt-plan
  text: 'Independently: $\pi(x) \sim x/\log x$, via ζ(1 + it) ≠ 0.'
- year: 1914
  title: Zeros on the line, and Li’s lead
  people: G. H. Hardy, J. E. Littlewood
  chapter: littlewood
  text: 'Hardy: infinitely many zeros on the critical line. Littlewood: π(x) − li(x) changes sign infinitely often.'
- year: 1919
  title: Brun’s theorem
  people: Viggo Brun
  chapter: twin-primes
