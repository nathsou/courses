# Timeline: list of { year, title, people, chapter, text }. Negative years are BC.
- year: -300
  title: Infinitely many primes
  people: Euclid
  chapter: infinitely-many
  text: 'Book IX, Proposition 20 of the *Elements*: prime numbers are more than any assigned multitude of primes.'
- year: -240
  title: The sieve
  people: Eratosthenes
  chapter: sieves
  text: 'A method for listing the primes by crossing out multiples, described later by Nicomachus.'
- year: 1640
  title: Fermat’s little theorem and two squares
  people: Pierre de Fermat
  chapter: fermat-euler
  text: '$a^{p-1} \equiv 1 \pmod p$, and the claim that primes $p \equiv 1 \pmod 4$ are sums of two squares, both stated in letters without proof.'
- year: 1735
  title: The Basel problem
  people: Leonhard Euler
  chapter: euler-product
  text: '$1 + \frac14 + \frac19 + \cdots = \frac{\pi^2}{6}$.'
- year: 1737
  title: The Euler product
  people: Leonhard Euler
  chapter: euler-product
  text: '$\sum n^{-s} = \prod_p(1 - p^{-s})^{-1}$, and the divergence of $\sum 1/p$.'
- year: 1742
  title: Goldbach’s conjecture
  people: Christian Goldbach, Leonhard Euler
  chapter: goldbach
  text: 'Every even number greater than $2$ is a sum of two primes: proposed in letters, still open.'
- year: 1749
  title: Two squares proved
  people: Leonhard Euler
  chapter: gaussian-primes
  text: 'The first proof of Fermat’s two-squares theorem.'
- year: 1792
  title: Gauss’s guess
  people: Carl Friedrich Gauss
  chapter: gauss
  text: 'From tables of primes, the density of primes near $x$ is about $1/\log x$ (recalled in a letter of 1849).'
- year: 1796
  title: Quadratic reciprocity
  people: Carl Friedrich Gauss
  chapter: quadratic-residues
  text: 'The first complete proof, published in the *Disquisitiones Arithmeticae* (1801).'
- year: 1837
  title: Primes in progressions
  people: Peter Gustav Lejeune Dirichlet
  chapter: dirichlet
  text: 'Infinitely many primes $\equiv a \pmod q$ when $\gcd(a, q) = 1$, with characters and $L$-functions.'
- year: 1850
  title: Chebyshev’s bounds
  people: Pafnuty Chebyshev
  chapter: chebyshev
  text: 'π(x) is within constant factors of $x/\log x$; Bertrand’s postulate follows.'
- year: 1859
  title: Riemann’s paper
  people: Bernhard Riemann
  chapter: riemann-hypothesis
  text: '*On the number of primes less than a given magnitude*: ζ as a complex function, the functional equation, the explicit formula, and the Riemann Hypothesis.'
- year: 1874
  title: Mertens’ theorems
  people: Franz Mertens
  chapter: mertens
  text: 'Sums $\sum_{p \le x}\frac{\log p}{p}$ and $\sum_{p \le x}\frac1p$, and the product $\prod_{p \le x}(1 - \frac1p) \sim e^{-\gamma}/\log x$.'
- year: 1876
  title: Lucas’s test
  people: Édouard Lucas
  chapter: certificates
  text: 'Proves $2^{127} - 1$ prime, the largest known prime for 75 years.'
- year: 1893
  title: Hadamard products
  people: Jacques Hadamard
  chapter: functional-equation
  text: 'Entire functions of finite order are determined by their zeros; ξ has a product over the zeros of ζ.'
- year: 1895
