<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" role="img" aria-labelledby="title desc">
  <title id="title">Walking and running: two simplified mechanical pictures</title>
  <desc id="desc">In walking, the centre of mass rises over the supporting limb and falls towards the next step. In running, a simplified spring compresses and recoils. These are conceptual diagrams, not measured kinematics.</desc>
  <rect width="700" height="300" rx="6" fill="#f0f1e9"/>
  <g font-family="sans-serif" fill="#23312b"><text x="28" y="35" font-size="17">Walking · over a supporting limb</text><text x="370" y="35" font-size="17">Running · loading and recoil</text></g>
  <g fill="none" stroke-linecap="round">
    <path d="M30 230H330M370 230H670" stroke="#a6b3a5" stroke-width="1.5"/>
    <path d="M80 148Q175 70 275 148" stroke="#a66c20" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M80 148L175 230M175 104V230M275 148L175 230" stroke="#285e4d" stroke-width="3"/>
    <path d="M436 130V157l-10 8 20 12-20 12 10 8V230M594 95V140l-12 10 24 15-24 15 24 15-12 10V230" stroke="#285e4d" stroke-width="3"/>
    <path d="M460 96V140l-5-8m5 8 5-8M618 141V100l-5 8m5-8 5 8" stroke="#a66c20" stroke-width="2"/>
  </g>
  <g fill="#285e4d"><circle cx="80" cy="148" r="8"/><circle cx="175" cy="104" r="8"/><circle cx="275" cy="148" r="8"/><circle cx="436" cy="130" r="10"/><circle cx="594" cy="95" r="10"/></g>
  <g font-family="sans-serif" font-size="12" fill="#58655d"><text x="66" y="270">Centre-of-mass path · inverted-pendulum analogy</text><text x="406" y="270">Compression</text><text x="566" y="270">Recoil</text><text x="28" y="290">Original conceptual schematic · no joint angles, speeds or energy magnitudes implied</text></g>
</svg>
