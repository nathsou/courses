<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <script>
      try {
        const choice = localStorage.getItem('theme');
        document.documentElement.dataset.theme = choice === 'light' || choice === 'dark' ? choice : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (localStorage.getItem('human-evolution:sidebar') === 'collapsed') document.documentElement.dataset.sidebar = 'collapsed';
      } catch {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
