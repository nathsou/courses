type checker:
  term: type checker
  definition: "The part of the TypeScript compiler that computes types and symbols for a program, lazily, as questions are asked."
  chapter: types
parser services:
  term: parser services
  definition: "What typescript-eslint gives rules besides the tree: the TypeScript program and the maps between ESTree nodes and TypeScript nodes, when the file was parsed with a program."
  chapter: types
narrowing:
  term: narrowing (types)
  definition: "TypeScript's computation of a more precise type for a variable at a given point, from the conditions and assignments that control flow passes through to reach it."
  chapter: types
flow-sensitive:
  term: flow-sensitive
  definition: "Of an analysis: computing a separate answer for each point of the program, taking the order of statements into account."
  chapter: types
orphan file:
  term: orphan file
  definition: "A JavaScript or TypeScript file that no tsconfig.json of the project includes. SonarJS analyses orphan files with programs built from default or merged options."
  chapter: types
