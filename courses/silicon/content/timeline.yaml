# Timeline: year, title, people, chapter, text (Markdown).
- year: 1928
  title: Electrons in crystals
  people: Felix Bloch
  chapter: bands
  text: Bloch shows that electrons in a periodic lattice occupy bands of allowed energy.
- year: 1931
  title: The theory of semiconductors
  people: Alan Herries Wilson
  chapter: bands
  text: Wilson uses band theory to explain metals, insulators and semiconductors.
- year: 1947
  title: The point-contact transistor
  people: John Bardeen, Walter Brattain
  chapter: bands
  text: At Bell Labs, two gold contacts on a slab of germanium amplify a signal.
- year: 1954
  title: The silicon transistor
  people: Gordon Teal
  chapter: bands
  text: Texas Instruments announces the first commercial silicon transistor.
- year: 1940
  title: The p–n junction
  people: Russell Ohl
  chapter: junction
  text: A cracked rod of silicon, p-type on one side and n-type on the other, produces half a volt under a flashlight.
- year: 1949
  title: Theory of the junction
  people: William Shockley
  chapter: junction
  text: Shockley publishes the theory of p–n junctions and of the junction transistor.
- year: 1925
  title: The field-effect transistor, on paper
  people: Julius Edgar Lilienfeld
  chapter: mosfet
  text: Lilienfeld files the first patent for a field-effect transistor; nobody can make one work for decades.
- year: 1959
  title: The MOSFET
  people: Mohamed Atalla, Dawon Kahng
  chapter: mosfet
  text: At Bell Labs, a thermally grown oxide under an aluminium gate makes the field-effect transistor work.
- year: 2007
  title: High-k metal gates
  chapter: mosfet
  text: Hafnium-based gate dielectrics and metal gates replace silicon dioxide and polysilicon in leading processes.
- year: 2011
  title: FinFETs
  chapter: mosfet
  text: The first production transistors with the channel raised into a fin, gated on three sides.
- year: 1963
  title: CMOS
  people: Frank Wanlass, Chih-Tang Sah
  chapter: cmos
  text: A logic gate of one p-channel and one n-channel transistor draws only nanowatts in either state.
- year: 1965
  title: Moore’s law
  people: Gordon Moore
  chapter: speed-power
  text: Moore predicts that the number of components per chip will keep doubling every year; in 1975 he revises it to every two years.
- year: 1974
  title: Dennard scaling
  people: Robert Dennard and colleagues
  chapter: speed-power
  text: The rules for shrinking a MOSFET while keeping power per area constant.
- year: 2005
  title: The power wall
  chapter: speed-power
  text: Processor clock speeds stop rising; the extra transistors go into more cores.
- year: 1966
  title: The one-transistor DRAM cell
  people: Robert Dennard
  chapter: memory
  text: Dennard proposes storing a bit as charge on a capacitor behind a single transistor.
- year: 1970
  title: The Intel 1103
  chapter: memory
  text: The first commercially successful DRAM chip, 1 024 bits; it begins the end of magnetic-core memory.
